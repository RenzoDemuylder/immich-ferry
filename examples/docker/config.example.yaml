# Used with SYNC_CONFIG_FILE=/etc/immich-ferry/config.yaml. Environment variables override this file.
instances:
  a:
    url: https://photos-a.example.com
    apiKeyFile: /run/secrets/immich_a_key
    insecureTLS: false
  b:
    url: https://photos-b.example.com
    apiKeyFile: /run/secrets/immich_b_key
    insecureTLS: false
sync:
  interval: 15m
  concurrency: 4
  dryRun: false
  propagateRemovals: true
  maxRemovalRatio: 0.2
  maxRemovalsMin: 10
  conflictWinner: a
  metadata: true
  albumInfo: true
  restoreTrashed: true
  copyBudget: 20m
  pendingMetaTimeout: 1h
  # Album discovery instead of `pairs` (remove `pairs` then): off | all | marker
  # discovery: marker
  # discoveryMarker: "🔁"
  # Share albums created by discovery with these users of each side (emails or user ids):
  # discoveryShare: {a: [alice@example.com], b: [bob@example.com], role: editor, trashOnTeardown: false, dedicatedUser: false}
pairs:
  - name: family
    a: {albumId: 11111111-1111-1111-1111-111111111111}
    b: {albumId: 22222222-2222-2222-2222-222222222222}
  - name: holidays
    a: {albumId: 33333333-3333-3333-3333-333333333333}
    b: {albumId: 44444444-4444-4444-4444-444444444444}
stateDir: /data
httpAddr: ":8080"
log:
  level: info
  format: json
